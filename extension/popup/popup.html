<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 230px;
      margin: 0;
      padding: 14px;
      background: #111114;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      user-select: none;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      color: #a8a8b2;
    }
    .btn {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn.active {
      background: rgba(255, 255, 255, 0.24);
      border-color: #fff;
      font-weight: 700;
    }
    .desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      line-height: 1.4;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      margin: 12px 0 10px 0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
    }
    .toggle-row input {
      cursor: pointer;
      accent-color: #3b82f6;
      width: 15px;
      height: 15px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="title">Vitrina <span class="badge">Theme</span></div>
  <button id="theme-ink" class="btn active">✨ Ink (основная)</button>
  <button id="theme-gloss" class="btn">🖤 Gloss (монохром)</button>
  <div class="desc">Клик по активной вкладке открывает адресную строку. В Vitrina цвет адаптируется под сайт.</div>

  <div class="divider"></div>
  <label class="toggle-row">
    <input type="checkbox" id="always-show-left">
    <span>Всегда отображать левое меню</span>
  </label>
  <label class="toggle-row">
    <input type="checkbox" id="always-show-right">
    <span>Всегда отображать правое меню</span>
  </label>

  <script src="popup.js"></script>
</body>
</html>
